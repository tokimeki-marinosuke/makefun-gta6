<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ASTER TIDE</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #182b36; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #title-menu { position: fixed; inset: 0; display: flex; align-items: center; color: #fff2d7; font-family: system-ui, sans-serif; }
  #title-menu[hidden] { display: none; }
  .title-content { margin-left: max(6vw, calc((100vw - 150vh) / 2)); pointer-events: none; }
  .title-content h1 { margin: 0; font-size: clamp(28px, min(7vw, 12vh), 108px); line-height: 1; letter-spacing: -0.065em; }
  .title-content p { margin: 0.9em 0 1.1em; font-size: clamp(13px, 1.55vw, 22px); }
  .title-content button { pointer-events: auto; border: 1px solid #ffd388; background: #233049; color: #fff2d7; padding: 0.65em 1em; font: inherit; cursor: pointer; }
  .title-content button:first-of-type:not([hidden]), .title-content button:hover { background: #ffd388; color: #233049; }
  .title-content button:focus-visible { outline: 2px solid white; outline-offset: 3px; }
</style>
</head>
<body>
<canvas id="game" aria-label="Walk or drive in Aster Tide with WASD or the arrow keys. Press E to enter or exit a car. Press F to shove while on foot."></canvas>
<section id="title-menu" aria-labelledby="game-title" hidden>
  <div class="title-content">
    <h1 id="game-title">ASTER TIDE</h1>
    <p>クリックまたはキーで開始</p>
    <button id="continue" type="button" hidden>続きから</button>
    <button id="new-game" type="button">はじめから</button>
  </div>
</section>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
